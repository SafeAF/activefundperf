name: ETF data collection

on:
  schedule:
    - cron: '37 18 * * 1-5'
      timezone: America/New_York
    - cron: '17 22 * * 1-5'
      timezone: America/New_York
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: income-fund-lab-collect
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Collect ETF data
        id: collect_data
        continue-on-error: true
        run: |
          set +e
          python -m income_fund_lab.collect
          status=$?
          echo "COLLECT_STATUS=$status" >> "$GITHUB_ENV"
          exit 0

      - name: Commit and push new data
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- data; then
            echo "No new source data to archive."
          else
            git add data
            git commit -m "Archive ETF source snapshots $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi

      - name: Fail if collection reported a source error
        if: env.COLLECT_STATUS != '0'
        run: |
          echo "One or more required sources failed during collection."
          exit 1
